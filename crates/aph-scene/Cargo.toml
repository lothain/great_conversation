[package]
name = "aph-scene"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Renderer-independent scene for the aphorisms globe: located items, geometry buffers, overlay raster, time rules, picking"

[features]
# The `aph-bake` tool: precomputes what the page and globe would otherwise build at startup.
bake = ["dep:anyhow", "dep:image"]

[dependencies]
anyhow = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
aph-data = { path = "../aph-data", default-features = false }
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
anyhow = "1"

[[bin]]
name = "aph-bake"
required-features = ["bake"]
