[workspace]
resolver = "3"
members = ["crates/aph-data", "crates/aph-scene", "crates/aph-globe"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"  # Bevy systems take resources and queries by value
too_many_arguments = "allow"      # ...and often many of them
cast_precision_loss = "allow"     # f64 data -> f32 GPU
cast_possible_truncation = "allow"
unreadable_literal = "allow"      # hex colours (0x8a2f1d) read better unseparated
float_cmp = "allow"               # tests compare exactly-representable values
cast_sign_loss = "allow"          # deliberate quantization of non-negative values to u8/u32
pub_underscore_fields = "allow"   # GPU uniform padding fields
many_single_char_names = "allow"  # geometry (x, y, a, b, c, d)
missing_panics_doc = "allow"
too_many_lines = "allow"
needless_range_loop = "allow"

# Bevy is slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# The web build: optimized for size (Cloudflare Pages caps each file at 25 MiB).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
